<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bang &amp; Olufsen</title>
    <link rel="icon" type="image/png"
     href="./src/images/Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
      crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header
      class="header"
      id="header"
    >
      <div class="header__top container">
        <a
          href="#header"
          class="header__logo"
        >
          <img
            class="header__image"
            src="./src/images/Logo.png"
            alt="Bang & Olufsen logo"
          />
        </a>

        <div class="header__icons">
          <a
            href="tel:+12345555555"
            class="icon icon--phone"
            aria-label="Call Bang and Olufsen"
          >
            <span class="icon__number">+1 234 555-55-55</span>
          </a>

          <a
            href="#menu"
            class="icon icon--menu"
            aria-label="Open menu"
          ></a>
        </div>
      </div>

      <div class="header__content container">
        <h1 class="header__title">Your senses.
          <br> Set free.
        </h1>
      </div>
    </header>

    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="menu__container container">
        <div class="menu__top">
          <a
            href="#header"
            class="menu__logo"
          >
            <img
              src="src/images/header/logo.png"
              alt="Bang & Olufsen logo"
            />
          </a>
          <a
            href="#"
            class="menu__close"
            aria-label="Close menu"
          ></a>
        </div>

        <div class="menu__bottom">
          <nav
            class="menu__nav"
            aria-label="Main navigation"
          >
            <ul class="menu__list">
              <li class="menu__item">
                <a
                  href="#recommended"
                  class="menu__link"
                >
                  Recommended
                </a>
              </li>
              <li class="menu__item">
                <a
                  href="#categories"
                  class="menu__link"
                >
                  Categories
                </a>
              </li>
              <li class="menu__item">
                <a
                  href="#about"
                  class="menu__link"
                >
                  About Us
                </a>
              </li>
              <li class="menu__item">
                <a
                  href="#contact"
                  class="menu__link"
                >
                  Contact Us
                </a>
              </li>
            </ul>
          </nav>

          <div class="menu__contacts">
            <a
              href="tel:+12345555555"
              class="menu__phone"
            >
              +1 234 555-55-55
            </a>

            <a
              href="tel:+12345555555"
              class="menu__btn-call"
            >
              Call to order
            </a>
          </div>
        </div>
      </div>
    </aside>
  </body>
</html>
